---
- name: Install networking stack
  ansible.builtin.dnf:
    name:
      - NetworkManager
      - NetworkManager-wifi
      - NetworkManager-bluetooth
      - wireguard-tools
      - bluez
      - bluez-tools
    state: present
  become: true

- name: Enable NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    enabled: true
    state: started
  become: true
