---
- name: Install development baseline
  ansible.builtin.dnf:
    name:
      - docker
      - docker-compose-plugin
      - distrobox
      - podman
      - gcc
      - gcc-c++
      - make
    state: present
  become: true

- name: Enable Docker when requested
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  become: true
  when: sn0w_enable_docker | bool

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    groups: docker
    append: true
  become: true
  when: sn0w_enable_docker | bool
