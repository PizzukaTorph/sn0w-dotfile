---
- name: Check whether Quickshell is available from configured repositories
  ansible.builtin.command: dnf -q list --available quickshell
  register: quickshell_available
  changed_when: false
  failed_when: false

- name: Install Quickshell when available
  ansible.builtin.dnf:
    name: quickshell
    state: present
  become: true
  when: quickshell_available.rc == 0

- name: Link Quickshell configuration
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../shell/quickshell"
    dest: "{{ ansible_facts['user_dir'] }}/.config/quickshell"
    state: link
    force: true
