---
- name: Install Fedora Quickshell build compatible with Qt 6.11
  ansible.builtin.dnf:
    name: "quickshell-0.2.1^git20260209.dacfa9d-5.fc44"
    state: present
    allow_downgrade: true
    disablerepo:
      - "copr:copr.fedorainfracloud.org:nett00n:hyprland"
  become: true

- name: Install Qt Wayland platform plugin
  ansible.builtin.dnf:
    name: qt6-qtwayland
    state: present
  become: true

- name: Link Quickshell configuration
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../shell/quickshell"
    dest: "{{ ansible_facts['user_dir'] }}/.config/quickshell"
    state: link
    force: true

- name: Link sn0w shell user service
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../systemd/user/sn0w-shell.service"
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/sn0w-shell.service"
    state: link
    force: true

- name: Reload systemd user units
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user

- name: Enable sn0w shell for graphical sessions
  ansible.builtin.systemd_service:
    name: sn0w-shell.service
    enabled: true
    scope: user
