---
- name: Install base workstation packages
  ansible.builtin.dnf:
    name:
      - git
      - curl
      - wget
      - jq
      - ripgrep
      - fd-find
      - fzf
      - zsh
      - unzip
      - tar
      - rsync
      - openssh-clients
      - wl-clipboard
      - cliphist
      - grim
      - slurp
      - wf-recorder
      - playerctl
      - foot
      - polkit
      - xdg-user-dirs
      - xdg-utils
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - libsecret
    state: present
  become: true

- name: Create sn0w config root
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/sn0w"
    state: directory
    mode: '0755'

- name: Ensure local bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin"
    state: directory
    mode: '0755'

- name: Ensure systemd user unit directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: Install sn0w SSH configurator
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../scripts/sn0w-ssh-configure"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/sn0w-ssh-configure"
    state: link
    force: true

- name: Install sn0w SSH launcher
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../scripts/sn0w-ssh"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/sn0w-ssh"
    state: link
    force: true

- name: Install sn0w SSH askpass helper
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../scripts/sn0w-ssh-askpass"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/sn0w-ssh-askpass"
    state: link
    force: true

- name: Ensure sn0w SSH helper scripts are executable
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0755'
  loop:
    - "{{ playbook_dir }}/../scripts/sn0w-ssh-configure"
    - "{{ playbook_dir }}/../scripts/sn0w-ssh"
    - "{{ playbook_dir }}/../scripts/sn0w-ssh-askpass"

- name: Install sn0w profile marker
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/sn0w/profile"
    content: "{{ sn0w_profile }}\n"
    mode: '0644'
