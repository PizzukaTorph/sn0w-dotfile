---
- name: Install base workstation packages
  ansible.builtin.dnf:
    name:
      - git
      - curl
      - wget
      - jq
      - ripgrep
      - fd-find
      - fzf
      - zsh
      - unzip
      - tar
      - rsync
      - openssh-clients
      - wl-clipboard
      - cliphist
      - grim
      - slurp
      - wf-recorder
      - playerctl
      - foot
      - polkit
      - xdg-user-dirs
      - xdg-utils
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - libsecret
      - util-linux
      - python3-pyyaml
    state: present
  become: true

- name: Create sn0w config root
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/sn0w"
    state: directory
    mode: '0755'

- name: Ensure local bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin"
    state: directory
    mode: '0755'

- name: Ensure systemd user unit directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: Install sn0w helper scripts
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../scripts/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - sn0w-ssh-configure
    - sn0w-ssh
    - sn0w-ssh-askpass
    - sn0w-session
    - sn0w-project

- name: Ensure sn0w helper scripts are executable
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../scripts/{{ item }}"
    mode: '0755'
  loop:
    - sn0w-ssh-configure
    - sn0w-ssh
    - sn0w-ssh-askpass
    - sn0w-session
    - sn0w-project

- name: Install sn0w profile marker
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/sn0w/profile"
    content: "{{ sn0w_profile }}\n"
    mode: '0644'
