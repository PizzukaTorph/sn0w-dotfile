# sn0w Hyprland entrypoint
#
# Keep this file intentionally small. Split input, monitors, binds and window
# rules as they are implemented and validated on the VM.

$terminal = ghostty
$fileManager = nautilus

exec-once = systemctl --user start sn0w-shell.service

# Safe VM/default monitor rule; Asahi-specific scaling is added separately.
monitor = ,preferred,auto,1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Core sn0w contracts.
bind = SUPER, SPACE, exec, quickshell ipc call launcher toggle
bind = SUPER, TAB, exec, quickshell ipc call switcher toggle
bind = SUPER, UP, exec, quickshell ipc call overview toggle
bind = SUPER SHIFT, RETURN, exec, ghostty
bind = SUPER, E, exec, nautilus

# Workspace navigation baseline.
bind = SUPER, LEFT, workspace, e-1
bind = SUPER, RIGHT, workspace, e+1
