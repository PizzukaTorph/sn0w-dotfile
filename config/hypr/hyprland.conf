# sn0w Hyprland entrypoint
#
# Keep this file intentionally small. Split input, monitors, binds and window
# rules as they are implemented and validated on the VM.

$terminal = ghostty
$fileManager = nautilus

# Quickshell owns the visible sn0w shell. Start it from the compositor so it
# inherits the active Wayland session environment.
exec-once = qs

# Safe VM/default monitor rule; Asahi-specific scaling is added separately.
monitor = ,preferred,auto,1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Core sn0w contracts.
bind = SUPER, SPACE, exec, qs ipc call launcher toggle
bind = SUPER, TAB, exec, qs ipc call switcher toggle
bind = SUPER, UP, exec, qs ipc call overview toggle
bind = SUPER SHIFT, RETURN, exec, ghostty
bind = SUPER, E, exec, nautilus

# Workspace navigation baseline.
bind = SUPER, LEFT, workspace, e-1
bind = SUPER, RIGHT, workspace, e+1
